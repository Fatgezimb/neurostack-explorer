[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostack-explorer-artifacts"
version = "1.0.0"
description = "Deterministic offline NWB-to-web artifact pipeline for NeuroStack Explorer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py==3.15.1",
  "ipykernel==6.30.1",
  "jsonschema==4.26.0",
  "nbclient==0.10.2",
  "nbconvert==7.17.1",
  "nbformat==5.10.4",
  "numpy==2.3.3",
  "nwbinspector==0.7.2",
  "pynwb==3.1.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.21",
]
# Exact pins used by the executed aligned-model fixtures. CmdStan 2.39.0 is a
# separately compiled toolchain rather than a PyPI package.
models = [
  "bridgestan==2.9.0",
  "cmdstanpy==1.3.0",
  "jax==0.10.1",
  "nemos==0.2.9",
  "pynapple==0.11.3",
  "scikit-learn==1.9.0",
  "torch==2.12.1",
]
visual-models = [
  "figurl==0.3.1",
  "plenoptic==2.0.1",
  "plotly==6.8.0",
]

[project.scripts]
neurostack-build-artifacts = "neurostack_explorer.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
